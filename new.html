    function filterVideos() {

      renderVideos(filtered);

  <script>
    function b64encode(buf) {
      var bin = "", bytes = new Uint8Array(buf), len = bytes.byteLength;
      for (var i = 0; i < len; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    let generatedFinalHtml = "";

    async function generateEncryptedPayload() {
      const statusEl = document.getElementById('status');
      statusEl.style.color = "#a5b4fc";
      statusEl.innerText = "암호화 연산 중 (PBKDF2 100,000회)...";

      const password = "tmfqofkd!!";
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));

      const pwEncoded = new TextEncoder().encode(password);
      const keyMaterial = await crypto.subtle.importKey("raw", pwEncoded, "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt"]
      );

      const rawHtml = document.getElementById('raw-dashboard-html').value.trim();
      const htmlEncoded = new TextEncoder().encode(rawHtml);
      const ciphertext = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        htmlEncoded
      );

      const payload = {
        salt: b64encode(salt),
        iv: b64encode(iv),
        ct: b64encode(ciphertext),
        iter: 100000,
        bid: Date.now()
      };

      generatedFinalHtml = 
        '<!DOCTYPE html>\n' +
        '<html lang="ko">\n' +
        '<head>\n' +
        '<meta charset="utf-8">\n' +
        '<meta name="viewport" content="width=device-width,initial-scale=1">\n' +
        '<meta name="robots" content="noindex,nofollow">\n' +
        '<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 100 100\\'%3E%3Ctext y=\\'.9em\\' font-size=\\'90\\'%3E🌺%3C/text%3E%3C/svg%3E">\n' +
        '<title>하와이 오아후 가이드북</title>\n' +
        '<style>\n' +
        ':root{--bg:#0f1117;--card:#171a21;--line:#262b36;--tx:#e6e8ee;--dim:#9aa3b2;--acc:#6366f1;--bad:#e06060}\n' +
        '*{box-sizing:border-box}\n' +
        'body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}\n' +
        '.lock{width:min(360px,calc(100vw - 48px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,0.5)}\n' +
        '.lock .ico{font-size:32px;margin-bottom:12px}\n' +
        '.lock h1{font-size:18px;margin:0 0 6px;letter-spacing:-.01em;color:#fff}\n' +
        '.lock p{color:var(--dim);font-size:13px;margin:0 0 20px;line-height:1.5}\n' +
        '.lock input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);font-family:inherit;font-size:15px;padding:12px 14px;border-radius:10px;outline:none;text-align:center;letter-spacing:.15em;transition:border-color .15s}\n' +
        '.lock input:focus{border-color:var(--acc)}\n' +
        '.lock button{width:100%;margin-top:12px;background:var(--acc);border:none;color:#fff;font-family:inherit;font-size:14px;font-weight:600;padding:12px;border-radius:10px;cursor:pointer;transition:opacity .15s}\n' +
        '.lock button:hover{opacity:.9}\n' +
        '.lock button:disabled{opacity:.5;cursor:wait}\n' +
        '.msg{min-height:18px;margin-top:12px;font-size:12.5px;color:var(--bad)}\n' +
        '.msg.dim{color:var(--dim)}\n' +
        '</style>\n' +
        '</head>\n' +
        '<body>\n' +
        '<div class="lock">\n' +
        '  <div class="ico">🔒</div>\n' +
        '  <h1>오아후 스마트 여행 가이드북</h1>\n' +
        '  <p>비밀번호를 입력하면 대시보드가 복호화되어 열립니다.<br>인증은 이 브라우저에서 30분간 유지됩니다.</p>\n' +
        '  <input type="password" id="pw" autocomplete="current-password" autofocus aria-label="비밀번호" placeholder="비밀번호 입력">\n' +
        '  <button id="go" type="button">열기</button>\n' +
        '  <div class="msg" id="msg"></div>\n' +
        '</div>\n' +
        '<' + 'script>\n' +
        'var PAYLOAD = ' + JSON.stringify(payload) + ';\n' +
        'var SKEY="ckUnlockSession",SESSION_MS=30*60*1000;\n' +
        'var pw=document.getElementById("pw"),go=document.getElementById("go"),msg=document.getElementById("msg");\n' +
        'function b64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}\n' +
        'function ab2b64(buf){var y=new Uint8Array(buf),bin="",CH=8192;for(var i=0;i<y.length;i+=CH)bin+=String.fromCharCode.apply(null,y.subarray(i,i+CH));return btoa(bin);}\n' +
        'function render(html){\n' +
        '  document.open();\n' +
        '  document.write(html);\n' +
        '  document.close();\n' +
        '}\n' +
        'async function decryptWith(key){\n' +
        '  var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.ct));\n' +
        '  return new TextDecoder().decode(plain);\n' +
        '}\n' +
        'async function tryCached(){\n' +
        '  try{\n' +
        '    var s=JSON.parse(localStorage.getItem(SKEY)||"null");\n' +
        '    if(!s||Date.now()>s.exp){localStorage.removeItem(SKEY);return;}\n' +
        '    msg.className="msg dim";msg.textContent="자동 인증 확인 중…";\n' +
        '    var key=await crypto.subtle.importKey("raw",b64(s.k),{name:"AES-GCM"},false,["decrypt"]);\n' +
        '    var html=await decryptWith(key);\n' +
        '    render(html);\n' +
        '  }catch(e){\n' +
        '    localStorage.removeItem(SKEY);\n' +
        '    msg.textContent="";\n' +
        '  }\n' +
        '}\n' +
        'if(document.readyState==="loading"){\n' +
        '  document.addEventListener("DOMContentLoaded",function(){setTimeout(tryCached,0);});\n' +
        '}else{\n' +
        '  setTimeout(tryCached,0);\n' +
        '}\n' +
        'async function unlock(){\n' +
        '  var v=pw.value;\n' +
        '  if(!v){msg.textContent="비밀번호를 입력해주세요.";return;}\n' +
        '  go.disabled=true;msg.className="msg dim";msg.textContent="복호화 확인 중…";\n' +
        '  try{\n' +
        '    var keyMat=await crypto.subtle.importKey("raw",new TextEncoder().encode(v),"PBKDF2",false,["deriveKey"]);\n' +
        '    var key=await crypto.subtle.deriveKey(\n' +
        '      {name:"PBKDF2",salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:"SHA-256"},\n' +
        '      keyMat,{name:"AES-GCM",length:256},true,["decrypt"]);\n' +
        '    var html=await decryptWith(key);\n' +
        '    try{\n' +
        '      var raw=await crypto.subtle.exportKey("raw",key);\n' +
        '      localStorage.setItem(SKEY,JSON.stringify({k:ab2b64(raw),exp:Date.now()+SESSION_MS}));\n' +
        '    }catch(e){}\n' +
        '    render(html);\n' +
        '  }catch(e){\n' +
        '    go.disabled=false;msg.className="msg";\n' +
        '    msg.textContent="비밀번호가 올바르지 않습니다.";\n' +
        '    pw.value="";pw.focus();\n' +
        '  }\n' +
        '}\n' +
        'go.addEventListener("click",unlock);\n' +
        'pw.addEventListener("keydown",function(e){if(e.key==="Enter")unlock();});\n' +
        '<' + '/script>\n' +
        '</body>\n' +
        '</html>';

      return generatedFinalHtml;
    }

    async function runBuild(mode) {
      const statusEl = document.getElementById('status');
      try {
        if (!window.crypto || !window.crypto.subtle) {
          statusEl.style.color = "#f43f5e";
          statusEl.innerText = "❌ 브라우저의 Web Crypto 기능이 비활성화되어 있습니다. 최신 크롬이나 사파리를 사용해주세요.";
          return;
        }

        if (!generatedFinalHtml) {
          await generateEncryptedPayload();
        }

        if (mode === 'download') {
          const blob = new Blob([generatedFinalHtml], { type: 'text/html' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'oahu.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          statusEl.style.color = "#10b981";
          statusEl.innerText = "✓ 성공! 암호화된 oahu.html 파일이 다운로드되었습니다.";
        } else if (mode === 'copy') {
          await navigator.clipboard.writeText(generatedFinalHtml);
          statusEl.style.color = "#10b981";
          statusEl.innerText = "✓ 성공! 암호화된 HTML 코드가 클립보드에 복사되었습니다.";
        } else if (mode === 'show') {
          document.getElementById('fallback-area').style.display = 'block';
          document.getElementById('output-text').value = generatedFinalHtml;
          statusEl.style.color = "#10b981";
          statusEl.innerText = "✓ 아래 텍스트 상자에 암호화 코드가 출력되었습니다.";
        }
      } catch (err) {
        console.error(err);
        statusEl.style.color = "#f43f5e";
        statusEl.innerText = "❌ 오류 발생: " + (err.message || err);
      }
    }
  </script>
