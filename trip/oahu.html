<title>sulkoo.works - 하와이 스마트 여행 가이드북</title>
<style>
:root{--bg:#0f1117;--card:#171a21;--line:#262b36;--tx:#e6e8ee;--dim:#9aa3b2;--acc:#6366f1;--bad:#e06060}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.lock{width:min(380px,calc(100vw - 48px));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 28px;text-align:center;box-shadow:0 20px 40px -15px rgba(0,0,0,0.5)}
.lock .ico{font-size:32px;margin-bottom:12px}
.lock h1{font-size:19px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em;color:#fff}
.lock p{color:var(--dim);font-size:13px;line-height:1.5;margin:0 0 22px}
.lock input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);font-family:inherit;font-size:15px;padding:12px 14px;border-radius:10px;outline:none;text-align:center;letter-spacing:.15em;transition:border-color .15s}
.lock input:focus{border-color:var(--acc)}
.lock button{width:100%;margin-top:12px;background:var(--acc);border:none;color:#fff;font-family:inherit;font-size:14px;font-weight:700;padding:12px;border-radius:10px;cursor:pointer;transition:opacity .15s, transform .1s}
.lock button:hover{opacity:.9}
.lock button:active{transform:scale(0.99)}
.msg{min-height:18px;margin-top:12px;font-size:12.5px;color:var(--bad);font-weight:500}
.msg.dim{color:var(--dim)}
</style>
</head>
<body>
<div class="lock">
  <div class="ico">🌺 🔒</div>
  <h1>sulkoo.works</h1>

  <button id="go" type="button">대시보드 열기</button>

</div>
