<title>하와이 오아후 가이드북</title>
<style>
:root{--bg:#0f1117;--card:#171a21;--line:#262b36;--tx:#e6e8ee;--dim:#9aa3b2;--acc:#6366f1;--bad:#e06060}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}.lock{width:min(360px,calc(100vw - 48px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,0.5)}.lock .ico{font-size:32px;margin-bottom:12px}.lock h1{font-size:18px;margin:0 0 6px;letter-spacing:-.01em;color:#fff}.lock p{color:var(--dim);font-size:13px;margin:0 0 20px;line-height:1.5}.lock input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);font-family:inherit;font-size:15px;padding:12px 14px;border-radius:10px;outline:none;text-align:center;letter-spacing:.15em;transition:border-color .15s}.lock input:focus{border-color:var(--acc)}.lock button{width:100%;margin-top:12px;background:var(--acc);border:none;color:#fff;font-family:inherit;font-size:14px;font-weight:600;padding:12px;border-radius:10px;cursor:pointer;transition:opacity .15s}.lock button:hover{opacity:.9}.lock button:disabled{opacity:.5;cursor:wait}.msg{min-height:18px;margin-top:12px;font-size:12.5px;color:var(--bad)}.msg.dim{color:var(--dim)}

var SKEY="ckUnlockSession",SESSION_MS=30*60*1000;
var pw=document.getElementById("pw"),go=document.getElementById("go"),msg=document.getElementById("msg");
function b64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
function ab2b64(buf){var y=new Uint8Array(buf),bin="",CH=8192;for(var i=0;i<y.length;i+=CH)bin+=String.fromCharCode.apply(null,y.subarray(i,i+CH));return btoa(bin);}
function render(html){
  document.open();
  document.write(html);
  document.close();
}
async function decryptWith(key){
  var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.ct));
  return new TextDecoder().decode(plain);
}
async function tryCached(){
  try{
    var s=JSON.parse(localStorage.getItem(SKEY)||"null");
    if(!s||Date.now()>s.exp){localStorage.removeItem(SKEY);return;}
    msg.className="msg dim";msg.textContent="자동 인증 확인 중…";
    var key=await crypto.subtle.importKey("raw",b64(s.k),{name:"AES-GCM"},false,["decrypt"]);
    var html=await decryptWith(key);
    render(html);
  }catch(e){
    localStorage.removeItem(SKEY);
    msg.textContent="";
  }
}
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",function(){setTimeout(tryCached,0);});
}else{
  setTimeout(tryCached,0);
}
async function unlock(){
  var v=pw.value;
  if(!v){msg.textContent="비밀번호를 입력해주세요.";return;}
  go.disabled=true;msg.className="msg dim";msg.textContent="복호화 확인 중…";
  try{
    var keyMat=await crypto.subtle.importKey("raw",new TextEncoder().encode(v),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:"SHA-256"},
      keyMat,{name:"AES-GCM",length:256},true,["decrypt"]);
    var html=await decryptWith(key);
    try{
      var raw=await crypto.subtle.exportKey("raw",key);
      localStorage.setItem(SKEY,JSON.stringify({k:ab2b64(raw),exp:Date.now()+SESSION_MS}));
    }catch(e){}
    render(html);
  }catch(e){
    go.disabled=false;msg.className="msg";
    msg.textContent="비밀번호가 올바르지 않습니다.";
    pw.value="";pw.focus();
  }
}
go.addEventListener("click",unlock);
pw.addEventListener("keydown",function(e){if(e.key==="Enter")unlock();});
