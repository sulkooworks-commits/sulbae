<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌺%3C/text%3E%3C/svg%3E">
<title>하와이 오아후 가이드북</title>
<style>
:root{--bg:#0f1117;--card:#171a21;--line:#262b36;--tx:#e6e8ee;--dim:#9aa3b2;--acc:#6366f1;--bad:#e06060}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.lock{width:min(360px,calc(100vw - 48px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,0.5)}
.lock .ico{font-size:32px;margin-bottom:12px}
.lock h1{font-size:18px;margin:0 0 6px;letter-spacing:-.01em;color:#fff}
.lock p{color:var(--dim);font-size:13px;margin:0 0 20px;line-height:1.5}
.lock input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);font-family:inherit;font-size:15px;padding:12px 14px;border-radius:10px;outline:none;text-align:center;letter-spacing:.15em;transition:border-color .15s}
.lock input:focus{border-color:var(--acc)}
.lock button{width:100%;margin-top:12px;background:var(--acc);border:none;color:#fff;font-family:inherit;font-size:14px;font-weight:600;padding:12px;border-radius:10px;cursor:pointer;transition:opacity .15s}
.lock button:hover{opacity:.9}
.lock button:disabled{opacity:.5;cursor:wait}
.msg{min-height:18px;margin-top:12px;font-size:12.5px;color:var(--bad)}
.msg.dim{color:var(--dim)}
</style>
</head>
<body>
<div class="lock">
  <div class="ico">🔒</div>
  <h1>오아후 스마트 여행 가이드북</h1>
  <p>비밀번호를 입력하면 대시보드가 복호화되어 열립니다.<br>인증은 이 브라우저에서 30분간 유지됩니다.</p>
  <input type="password" id="pw" autocomplete="current-password" autofocus aria-label="비밀번호" placeholder="비밀번호 입력">
  <button id="go" type="button">열기</button>
  <div class="msg" id="msg"></div>
</div>

var SKEY = "ckUnlockSession", SESSION_MS = 30 * 60 * 1000;
var pw = document.getElementById("pw"), go = document.getElementById("go"), msg = document.getElementById("msg");
function b64(s){ var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
function ab2b64(buf){ var y = new Uint8Array(buf), bin = "", CH = 8192; for (var i = 0; i < y.length; i += CH) bin += String.fromCharCode.apply(null, y.subarray(i, i + CH)); return btoa(bin); }
function render(html){ document.open(); document.write(html); document.close(); }
async function decryptWith(key){ var plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct)); return new TextDecoder().decode(plain); }
async function tryCached(){
  try {
    var s = JSON.parse(localStorage.getItem(SKEY) || "null");
    if (!s || Date.now() > s.exp) { localStorage.removeItem(SKEY); return; }
    msg.className = "msg dim"; msg.textContent = "자동 인증 확인 중…";
    var key = await crypto.subtle.importKey("raw", b64(s.k), {name: "AES-GCM"}, false, ["decrypt"]);
    var html = await decryptWith(key);
    render(html);
  } catch(e) {
    localStorage.removeItem(SKEY);
    msg.textContent = "";
  }
}

    var keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(v), "PBKDF2", false, ["deriveKey"]);

      {name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256"},
      keyMat, {name: "AES-GCM", length: 256}, true, ["decrypt"]);

      var raw = await crypto.subtle.exportKey("raw", key);

    go.disabled = false; msg.className = "msg";
